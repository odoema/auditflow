<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Upload — AuditFlow Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
    .upload-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--af-border);
    }
    .upload-item:last-child { border-bottom: none; }
    .upload-item.done { background: #f0fdf4; }
    .file-input-hidden { display: none; }
  </style>
</head>
<body class="client-portal-body">
  <div class="client-portal-card">
    <div class="client-portal-header">
      <div style="width:48px;height:48px;background:var(--af-accent);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem;font-weight:700;color:var(--af-primary);font-size:1.2rem">AF</div>
      <h1>Kampala Community Holdings Ltd</h1>
      <p>FY2026 External Audit · Document Requests</p>
    </div>

    <div style="padding:1.25rem 1.5rem 0.5rem">
      <p style="font-size:0.9rem;color:var(--af-text-muted);margin:0 0 1rem">
        Please upload the documents listed below. Files are placed directly into the secure audit folder structure.
      </p>
    </div>

    <div id="requestList">
      <!-- Populated by JS -->
    </div>

    <div style="padding:1rem 1.5rem 1.5rem;text-align:center">
      <p style="font-size:0.75rem;color:var(--af-text-muted);margin:0">
        Secure upload powered by AuditFlow · Google Drive<br>
        Token: <code id="tokenDisplay">REQ-00017</code>
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "REQ-00017";
    document.getElementById("tokenDisplay").textContent = token;

    const items = [
      { id: "REQ-00017", label: "Bank statements for all operating accounts (Jan–Dec 2026)", status: "Outstanding", priority: "High" },
      { id: "REQ-00022", label: "Schedule of related party transactions", status: "Outstanding", priority: "Medium" },
      { id: "REQ-00023", label: "Tax computations and URA correspondence", status: "Outstanding", priority: "High" },
      { id: "REQ-00018", label: "Fixed Asset Register as at 31 Dec 2026", status: "Received", priority: "High" },
      { id: "REQ-00019", label: "Debtors ageing report", status: "Received", priority: "Medium" },
      { id: "REQ-00021", label: "Trial Balance and General Ledger", status: "Received", priority: "High" }
    ];

    function render() {
      const list = document.getElementById("requestList");
      list.innerHTML = items.map(item => `
        <div class="upload-item ${item.status === 'Received' ? 'done' : ''}" id="item-${item.id}">
          <div>
            <div style="font-weight:600;font-size:0.9rem">
              ${item.status === 'Received' ? '☑' : '☐'} ${item.label}
            </div>
            <small style="color:var(--af-text-muted)">${item.id} · ${item.priority} priority</small>
          </div>
          <div>
            ${item.status === 'Outstanding' ? `
              <label class="btn-af btn-af-sm btn-af-primary" style="cursor:pointer;margin:0">
                <i class="bi bi-upload"></i> Upload
                <input type="file" class="file-input-hidden" onchange="handleUpload('${item.id}', this)">
              </label>
            ` : `<span class="badge-af badge-received">Received</span>`}
          </div>
        </div>
      `).join("");
    }

    function handleUpload(id, input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.status = "Received";
      render();
      setTimeout(() => {
        alert(`Document uploaded successfully.\n\nFile: ${file.name}\nRequest: ${id}\n\nIn the live system:\n• File is saved to the correct Google Drive folder\n• Request status → RECEIVED\n• Auditor is notified\n• Activity is logged`);
      }, 300);
    }

    render();
  </script>
</body>
</html>
