<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditFlow — Intelligent Audit Document & Workflow Management</title>
  <meta name="description" content="One intelligent workspace for managing audit clients, documents, working papers, requests, reviews and audit workflows — powered by Google Workspace, GitHub and AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Sidebar -->
  <aside class="af-sidebar">
    <div class="af-sidebar-brand">
      <div class="logo-icon">AF</div>
      <div>
        <h1>AuditFlow</h1>
        <small>Intelligent Audit Workspace</small>
      </div>
    </div>
    <nav class="af-nav">
      <a href="#dashboard" data-page="dashboard" class="active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="#clients" data-page="clients"><i class="bi bi-building"></i> Clients</a>
      <a href="#engagements" data-page="engagements"><i class="bi bi-briefcase"></i> Engagements</a>
      <a href="#documents" data-page="documents"><i class="bi bi-folder2-open"></i> Documents</a>
      <a href="#requests" data-page="requests"><i class="bi bi-send"></i> Requests</a>
      <a href="#working-papers" data-page="working-papers"><i class="bi bi-file-earmark-text"></i> Working Papers</a>
      <a href="#review" data-page="review"><i class="bi bi-chat-left-text"></i> Review</a>
      <a href="#tasks" data-page="tasks"><i class="bi bi-kanban"></i> Tasks</a>
      <a href="#reports" data-page="reports"><i class="bi bi-bar-chart"></i> Reports</a>
      <a href="#ai" data-page="ai"><i class="bi bi-robot"></i> AI Assistant</a>
      <a href="#settings" data-page="settings"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="af-sidebar-footer">
      Demo · Kampala, Uganda<br>
      Powered by Google Workspace + GitHub
    </div>
  </aside>

  <!-- Main -->
  <div class="af-main">
    <header class="af-topbar">
      <div class="d-flex align-center gap-2">
        <button class="af-mobile-toggle" id="mobileToggle" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="af-topbar-actions">
        <span class="text-muted" style="font-size:0.85rem">Demo Partner</span>
        <span class="badge-af badge-completed">Partner</span>
      </div>
    </header>
    <main class="af-content" id="afContent">
      <!-- Content rendered by app.js -->
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
